<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#090915"/>
      <stop offset="60%" stopColor="#161233"/>
      <stop offset="100%" stopColor="#2a1a4e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00f0ff"/>
      <stop offset="100%" stopColor="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="100%" stopColor="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="84" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Skyline Silhouettes in Background -->
  <rect x="40" y="240" width="60" height="200" fill="#120d2a"/>
  <rect x="70" y="210" width="10" height="30" fill="#120d2a"/>
  <rect x="110" y="200" width="80" height="240" fill="#1b173e"/>
  <rect x="360" y="220" width="70" height="220" fill="#120d2a"/>
  <rect x="420" y="250" width="60" height="190" fill="#1b173e"/>

  <!-- Glowing Stars / Neon Sparks -->
  <rect x="80" y="90" width="6" height="6" fill="#00f0ff"/>
  <rect x="420" y="110" width="8" height="8" fill="#ff007f"/>
  <rect x="260" y="60" width="6" height="6" fill="#ffe600"/>

  <!-- Hunter Drone Hovering in Top Left -->
  <g transform="translate(100, 140)">
    <!-- Thruster fire -->
    <rect x="-35" y="-4" width="25" height="8" fill="#ef4444"/>
    <rect x="-25" y="-2" width="12" height="4" fill="#fef08a"/>
    <!-- Drone Body -->
    <rect x="-10" y="-14" width="48" height="28" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="2"/>
    <rect x="2" y="-8" width="24" height="16" fill="#334155"/>
    <!-- Red glowing visor -->
    <rect x="16" y="-5" width="16" height="10" rx="3" fill="#ef4444"/>
    <rect x="22" y="-3" width="6" height="6" fill="#ffffff"/>
    <!-- Rotor -->
    <rect x="10" y="-22" width="8" height="8" fill="#0f172a"/>
    <rect x="-6" y="-24" width="40" height="4" fill="#94a3b8"/>
  </g>

  <!-- Rooftop Building Base -->
  <rect x="40" y="380" width="432" height="100" fill="#1a1b2e" stroke="#334155" stroke-width="3"/>
  <rect x="30" y="374" width="452" height="12" fill="#00f0ff"/>
  <!-- Windows -->
  <rect x="70" y="410" width="24" height="30" fill="#00f0ff" opacity="0.8"/>
  <rect x="130" y="410" width="24" height="30" fill="#ff007f" opacity="0.7"/>
  <rect x="190" y="410" width="24" height="30" fill="#ffe600" opacity="0.9"/>
  <rect x="310" y="410" width="24" height="30" fill="#00f0ff" opacity="0.8"/>
  <rect x="370" y="410" width="24" height="30" fill="#ff007f" opacity="0.7"/>

  <!-- Pixel Runner (Hero in Mid-Jump) -->
  <g transform="translate(260, 260) scale(4)">
    <!-- Red Bandana -->
    <rect x="-8" y="-15" width="8" height="4" fill="#dc2626"/>
    <rect x="-4" y="-17" width="18" height="5" fill="#dc2626"/>
    <!-- Face / Skin -->
    <rect x="0" y="-13" width="12" height="11" fill="#fcd34d"/>
    <!-- Eye -->
    <rect x="7" y="-10" width="3" height="3" fill="#0f172a"/>
    <!-- Hair -->
    <rect x="-4" y="-19" width="14" height="5" fill="#78350f"/>
    <!-- Blue Jacket / Torso -->
    <rect x="-3" y="-2" width="16" height="14" fill="#2563eb"/>
    <!-- Belt -->
    <rect x="-2" y="10" width="14" height="3" fill="#0f172a"/>
    <!-- Legs in Sprint -->
    <rect x="-7" y="13" width="8" height="9" fill="#1e293b"/>
    <rect x="8" y="12" width="8" height="9" fill="#1e293b"/>
    <!-- Red Sneakers -->
    <rect x="-10" y="20" width="9" height="5" fill="#ef4444"/>
    <rect x="11" y="19" width="9" height="5" fill="#ef4444"/>
  </g>

  <!-- Big Gold Coin Floating -->
  <g transform="translate(390, 310)">
    <circle cx="0" cy="0" r="28" fill="#d97706"/>
    <circle cx="0" cy="0" r="23" fill="url(#goldGrad)"/>
    <rect x="-6" y="-14" width="12" height="28" fill="#fef08a" opacity="0.75" rx="3"/>
  </g>
</svg>
